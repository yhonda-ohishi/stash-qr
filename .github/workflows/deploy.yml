name: Deploy

# main に入ったら本番 (stash.mtamaramu.com) へ出す。個人アプリなので staging は置かない。
# PR 側の CI (ci.yml の test) が green でないと main には入らない (branch protection)。
#
# ci.yml とファイルを分けているのは、ippoan/ci-workflows の auto-merge.yml が
# 「呼び出し元 workflow の deploy 系 job が auto-merge の needs に入っているか」を
# 静的検査するため。deploy は merge 後に走るもので、merge の gate ではない。
#
# 要 secret: CLOUDFLARE_API_TOKEN (GCP Secret Manager の同名 secret を流し込んだもの。
# account 24b4… の Workers / D1 / Workers Routes を編集できる)。

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

# 本番への書き込みは 1 本ずつ。後から来た方は前の完了を待つ (途中で切らない)。
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker
          cache-bin: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - run: cargo install --locked worker-build@0.8.6

      # wrangler deploy は D1 migration を当てないので先に当てる (新しい表を使うコードより先)。
      - name: D1 migrations (remote)
        run: npx wrangler d1 migrations apply DB --remote

      - name: wrangler deploy
        run: npx wrangler deploy

      # 未ログインのリクエストが Worker まで届かず Access で止まることを確かめる。
      # 200 や 503 (= Worker が応答) が返ったら Access が外れているので落とす。
      - name: Access が前に立っているか
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://stash.mtamaramu.com/api/item-types || true)
            case "$code" in
              302|401|403) echo "Access が応答: $code"; exit 0 ;;
              000|522|523|530) echo "まだ到達しない ($code)、待つ"; sleep 10 ;;
              *) echo "::error::Access を通らずに $code が返った"; exit 1 ;;
            esac
          done
          echo "::error::stash.mtamaramu.com に到達しない"; exit 1
