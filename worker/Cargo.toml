[package]
name = "stash-qr-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
futures-util = { version = "0.3", default-features = false }
getrandom = { version = "0.2", features = ["js"] }
hmac = "0.12"
js-sys = "0.3.105"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10"
wasm-bindgen-futures = "0.4.78"
web-sys = { version = "0.3.105", features = ["SubtleCrypto", "CryptoKey", "FormData", "Blob", "BlobPropertyBag"] }
worker = { version = "0.8.6", features = ["d1"] }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
