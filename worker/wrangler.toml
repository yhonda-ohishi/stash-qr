name = "stash-qr"
account_id = "24b45709d060d957340180e995f0d373"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"

# 本番の入口は stash.mtamaramu.com (Cloudflare Access の後ろ) だけ。workers.dev は閉じる。
workers_dev = false
# Previews (npx wrangler preview) を <preview>-stash-qr.<subdomain>.workers.dev で開くために有効。
# 本番の Version URL も workers.dev に出るが、Worker が毎回 Access の JWT を検証するので
# 未ログインは 401 (本番の AUD しか通らない)。Preview のホスト名は別の Access アプリで守る。
preview_urls = true

# QR に焼くドメイン。Access アプリ "stash-qr" がこの hostname を保護している。
routes = [{ pattern = "stash.mtamaramu.com", custom_domain = true }]

[build]
# subshell (カッコ) で web/ の cd を閉じないと、worker-build が web/ のまま走ってしまう。
command = "(cd ../web && npm ci && npm run build) && cargo install -q worker-build@0.8.6 && worker-build --release"

# web/dist (Preact/Vite のビルド結果) を静的アセットとして配る。run_worker_first で
# どのリクエストも先に Worker (auth::authenticate、fail closed) を通す。
[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

# 本番 D1 (apac)。ローカル (wrangler dev / テスト) は --persist-to の先に別に作られる。
[[d1_databases]]
binding = "DB"
database_name = "stash-qr"
database_id = "6dd77207-380a-44e7-bc86-814cf9dede69"
migrations_dir = "migrations"

# Cloudflare Access (docs/design.md「未決事項」)。空のままだと全リクエストが 503 (fail closed)。
# ACCESS_ISSUER = https://<team>.cloudflareaccess.com、ACCESS_AUD = Access アプリの AUD タグ。
# どちらも秘密ではない (JWT の中にそのまま入っている値)。
[vars]
# Access アプリ "stash-qr"。Google ログインで本人の email だけ許可。
ACCESS_ISSUER = "https://mtamaramu.cloudflareaccess.com"
ACCESS_AUD = "dc7fb2c8c7360e23af4c0154f3500978718ac19e341f8ee7ee1fdabcfa2f586c"
# 写真判定のモデル。判定ごとに ai_judgements.model に残すので、別名 (…-latest) ではなく版を固定する。
# キーは Worker secret の GEMINI_API_KEY。
GEMINI_MODEL = "gemini-3.8-flash"

# Flickr の資格情報は Worker secret で入れる (リポジトリには置かない):
#   npx wrangler secret put FLICKR_CONSUMER_KEY
#   npx wrangler secret put FLICKR_CONSUMER_SECRET
#   npx wrangler secret put FLICKR_ACCESS_TOKEN_JSON   # {"token","secret","userNsid","username"} の JSON
# 未設定の間は写真が送信待ち (status=pending) に残るだけで、他の API は動く。

# ---------------------------------------------------------------------------
# Previews (npx wrangler preview)。PR やブランチを本番と切り離して試す。
# D1 は Preview 用の stash-qr-preview に差し替える (本番のデータを汚さない)。
# Preview 用 DB への migration: npx wrangler d1 migrations apply DB --remote -c wrangler.preview-migrations.toml
# Access は Preview のホスト名を守る別アプリなので AUD が本番と違う。
# ---------------------------------------------------------------------------
[previews.vars]
ACCESS_ISSUER = "https://mtamaramu.cloudflareaccess.com"
# Access アプリ "stash-qr previews" (*-stash-qr.m-tama-ramu.workers.dev を保護)
ACCESS_AUD = "b4d76502dec96ce3bf36dfaa8b1dfd5c7d961a1ff881eb8f07906df811c08dc0"
GEMINI_MODEL = "gemini-3.8-flash"

[[previews.d1_databases]]
binding = "DB"
database_name = "stash-qr-preview"
database_id = "07672c8f-fdeb-45f2-a9c5-4b2c7ff4bcae"
migrations_dir = "migrations"
