name = "stash-qr"
account_id = "24b45709d060d957340180e995f0d373"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"

# 入口は stash.mtamaramu.com (Cloudflare Access の後ろ) だけ。workers.dev と
# preview URL は Access を通らないので閉じる (Worker 側でも JWT を検証するが二重に塞ぐ)。
workers_dev = false
preview_urls = false

# QR に焼くドメイン。Access アプリ "stash-qr" がこの hostname を保護している。
routes = [{ pattern = "stash.mtamaramu.com", custom_domain = true }]

[build]
command = "cargo install -q worker-build@0.8.6 && worker-build --release"

# 本番 D1 (apac)。ローカル (wrangler dev / テスト) は --persist-to の先に別に作られる。
[[d1_databases]]
binding = "DB"
database_name = "stash-qr"
database_id = "6dd77207-380a-44e7-bc86-814cf9dede69"
migrations_dir = "migrations"

# Cloudflare Access (docs/design.md「未決事項」)。空のままだと全リクエストが 503 (fail closed)。
# ACCESS_ISSUER = https://<team>.cloudflareaccess.com、ACCESS_AUD = Access アプリの AUD タグ。
# どちらも秘密ではない (JWT の中にそのまま入っている値)。
[vars]
# Access アプリ "stash-qr"。Google ログインで本人の email だけ許可。
ACCESS_ISSUER = "https://mtamaramu.cloudflareaccess.com"
ACCESS_AUD = "dc7fb2c8c7360e23af4c0154f3500978718ac19e341f8ee7ee1fdabcfa2f586c"

# Flickr の資格情報。cf-flickr-cam-worker と同じ Flickr App・同じアカウントの値を、
# 同じ Cloudflare Secrets Store から束ねる (値は Cloudflare の外に出ない)。
# FLICKR_ACCESS_TOKEN_JSON は {"token","secret","userNsid","username"} の JSON。
[[secrets_store_secrets]]
binding = "FLICKR_CONSUMER_KEY"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "rust-flickr-consumer-key"

[[secrets_store_secrets]]
binding = "FLICKR_CONSUMER_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "rust-flickr-consumer-secret"

[[secrets_store_secrets]]
binding = "FLICKR_ACCESS_TOKEN_JSON"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "FLICKR_ACCESS_TOKEN_JSON"
